[package]
name = "neutron_cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Syncs Neutron with upstream Zed and checks Neutron's layout invariants"

# Keep this tool out of the generated root workspace so it still builds when an upstream
# manifest is broken.
[workspace]

[[bin]]
name = "neutron"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
walkdir = "2.5.0"
