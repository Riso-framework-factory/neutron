# Where every upstream Zed path goes in Neutron. `cargo neutron sync` reads this file; the
# porting plan describes how crates move from `apps/ide` into `core` in closed batches.

[upstream]
repo = "https://github.com/zed-industries/zed"
ref = "main"
# Written by `cargo neutron sync`.
commit = "9f305aaf88370e8ca39c702242186e3d8f97ecca"
commit_date = "2026-10-23"

[layout]
# Destination of every upstream path that no rule below maps: the IDE canary.
ide = "apps/ide"
# Never copied. The root manifest, `.cargo/config.toml` and agent rules are generated from
# upstream instead; `.github` holds Zed's own workflows.
exclude = [
    ".github",
    "Cargo.toml",
    "Cargo.lock",
    ".cargo/config.toml",
    ".agents",
    ".factory",
    ".rules",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
]
# Exist at the Neutron root but are never written or cleaned by the sync.
unmanaged = [".git"]

# Upstream paths copied to the Neutron root instead of `apps/ide/`. `assets/` must sit at the
# root: crates refer to it as `../../assets` and debug builds read it from the repository root.
[layout.root]
"assets" = "assets"
".cargo" = ".cargo"
".config" = ".config"
"rust-toolchain.toml" = "rust-toolchain.toml"
"rustfmt.toml" = "rustfmt.toml"
"clippy.toml" = "clippy.toml"
"tooling/compliance" = "tooling/compliance"
"tooling/lints" = "tooling/lints"
"tooling/xtask" = "tooling/xtask"

[core]
# Upstream packages copied verbatim to `core/<directory>`, added in batches whose dependency
# closure stays inside core. A package nested in another package's directory (such as
# `refineable/derive_refineable`) moves with its parent.
crates = [
    # B1: GPUI and its Apache-2.0 foundation.
    "bench_metrics", "collections", "derive_refineable", "gpui", "gpui_apple", "gpui_ios",
    "gpui_linux", "gpui_macos", "gpui_macros", "gpui_platform", "gpui_shared_string",
    "gpui_tokio", "gpui_util", "gpui_web", "gpui_wgpu", "gpui_windows", "http_client",
    "http_client_tls", "path", "perf", "refineable", "reqwest_client", "scheduler", "sum_tree",
    "util", "util_macros", "zlog", "ztracing", "ztracing_macro",
    # B2: design system.
    "component", "icons", "menu", "mermaid_render", "syntax_theme", "theme", "ui", "ui_input",
    "ui_macros",
    # B3: settings, file system and persistence. Needs the `paths` and `release_channel` shims.
    "askpass", "clock", "cloud_llm_client", "db", "env_var", "file_content", "file_icons", "fs",
    "fs_benchmarks", "git", "language_model_core", "migrator", "net", "proto", "rope",
    "schema_generator", "settings", "settings_content", "settings_json", "settings_macros",
    "sqlez", "sqlez_macros", "telemetry", "telemetry_events", "text", "theme_importer",
    "theme_settings", "vim_mode_setting", "zed_env_vars", "zeta_prompt", "zlog_settings",
    # B4: platform services.
    "assets", "audio", "aws_http_client", "crashes", "credentials_provider", "feature_flags",
    "feature_flags_macros", "fuzzy", "fuzzy_nucleo", "hang_telemetry", "html_to_markdown",
    "http_proxy", "node_runtime", "oauth_callback_server", "proxy_handshake", "session",
    "shell_command_parser", "snippet", "streaming_diff", "system_specs", "time_format", "watch",
    "windows_resources", "zed_actions", "zed_credentials_provider",
    # B5: text, language and terminal engines.
    "grammars", "language", "language_core", "language_detection", "lsp", "markdown", "rpc",
    "task", "terminal", "worktree", "worktree_benchmarks",
    # B6: language model providers, MCP client and agent skills.
    "agent_skills", "anthropic", "bedrock", "context_server", "deepseek", "google_ai",
    "language_model", "llama_cpp", "lmstudio", "mistral", "ollama", "open_ai", "open_router",
    "openai_subscribed", "opencode", "web_search", "x_ai", "x_ai_subscribed",
]

# Riso crates that keep an upstream crate's name and replace it everywhere. The first sync copies
# the upstream crate; later syncs 3-way merge upstream changes since `base` into it.
[shim.paths]
origin = "crates/paths"
base = "9f305aaf88370e8ca39c702242186e3d8f97ecca"

[shim.release_channel]
origin = "crates/release_channel"
base = "9f305aaf88370e8ca39c702242186e3d8f97ecca"

[policy]
# Dev-dependencies of core crates that may point outside core, as "from -> to".
allow_core_dev_deps = [
    "markdown -> languages",
]
# Core files with out-of-crate paths that cannot resolve in Neutron's layout, with the reason.
allow_core_path_escapes = [
    # A test of `fs_embed!` in dev mode reads `crates/util/src`; run util's tests with
    # `--features debug-embed`, which upstream tests with a different path.
    "crates/util/src/util.rs",
    # Dev builds would read tree-sitter queries from `crates/grammars/src`; neutron.workspace.toml
    # enables `util/debug-embed` so they are embedded instead.
    "crates/grammars/src/grammars.rs",
]

# Literals the path fixer cannot find by itself: paths resolved against the current directory,
# or targets that are not tracked upstream.
[[rewrite.literals]]
file = "crates/zed/src/main.rs"
literal = "crates/grammars/src"
base = "root"

[[rewrite.literals]]
file = "crates/zed/build.rs"
literal = "../../.git/logs/HEAD"
base = "crate"

[agents]
sections = ["Rust coding guidelines", "Timers in tests", "GPUI", "Rules Hygiene"]
# Zed's PR review workflow asks agents to edit README.md on every change; it does not apply here.
drop_lines_containing = ["Remove this line to confirm you've reviewed this PR"]
skills = ["gpui-test", "gpui-bench", "lint-creator"]
