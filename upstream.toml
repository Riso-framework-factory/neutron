# Where every upstream Zed path goes in Neutron. `cargo neutron sync` reads this file. Core is the
# dependency closure of `[core] roots` (docs/adr/0007); everything else is mirrored into `apps/ide`.

[upstream]
repo = "https://github.com/zed-industries/zed"
ref = "main"
# Written by `cargo neutron sync`.
commit = "d93bf740852672fb299fcbdba3af1d5fd0253e92"
commit_date = "2026-10-24"

[layout]
# Destination of every upstream path that no rule below maps: the IDE canary.
ide = "apps/ide"
# Never copied. The root manifest, `.cargo/config.toml` and agent rules are generated from
# upstream instead; `.github` holds Zed's own workflows.
exclude = [
    ".github",
    "Cargo.toml",
    "Cargo.lock",
    ".cargo/config.toml",
    ".agents",
    ".factory",
    ".rules",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
]
# Exist at the Neutron root but are never written or cleaned by the sync.
unmanaged = [".git"]

# Upstream paths copied to the Neutron root instead of `apps/ide/`. `assets/` must sit at the
# root: crates refer to it as `../../assets` and debug builds read it from the repository root.
[layout.root]
"assets" = "assets"
".cargo" = ".cargo"
".config" = ".config"
"rust-toolchain.toml" = "rust-toolchain.toml"
"rustfmt.toml" = "rustfmt.toml"
"clippy.toml" = "clippy.toml"
"tooling/compliance" = "tooling/compliance"
"tooling/lints" = "tooling/lints"
"tooling/xtask" = "tooling/xtask"

[core]
# Core is the dependency closure (normal and build dependencies) of these roots: the upstream crates
# the framework itself needs. Everything else stays in the apps/ide mirror, including crates that
# merely look useful. Add a root only for something `riso/` or apps build on, and say why.
#
# The closure also pulls in crates that belong to the IDE but that two verbatim roots depend on:
# `settings_content` -> language_model_core, cloud_llm_client, zeta_prompt and
# `fs` -> git, askpass, net, proto, telemetry. They are types and dormant code; cutting them would
# mean shimming settings_content and fs.
roots = [
    # Windowing, rendering, input and platform backends; tokio interop for libraries that need it.
    "gpui", "gpui_platform", "gpui_tokio",
    # Design system and theme loading.
    "ui", "ui_input", "theme", "theme_settings",
    # Settings store, keymaps and settings file watching.
    "settings",
    # Persistence (SQLite key-value store) and window/session restore.
    "db", "session",
    # File system access and watching.
    "fs",
    # HTTP client.
    "http_client", "reqwest_client",
    # Fonts, icons and themes embedded from assets/.
    "assets",
    # Logging and tracing.
    "zlog", "zlog_settings", "ztracing",
    # Secure credential storage (keychain), keyed by the app identity.
    "credentials_provider", "zed_credentials_provider",
    # Crash dumps, system info for reports and main-thread hang detection, for riso_app.
    "crashes", "system_specs", "hang_telemetry",
    # Fuzzy matching for pickers and the command palette.
    "fuzzy", "fuzzy_nucleo",
    # Windows executable resources for bundling.
    "windows_resources",
]

# Riso crates that keep an upstream crate's name and replace it everywhere. The first sync copies
# the upstream crate; later syncs 3-way merge upstream changes since `base` into it.
[shim.paths]
origin = "crates/paths"
base = "d93bf740852672fb299fcbdba3af1d5fd0253e92"

[shim.release_channel]
origin = "crates/release_channel"
base = "d93bf740852672fb299fcbdba3af1d5fd0253e92"

[policy]
# Dev-dependencies of core crates that may point outside core, as "from -> to".
allow_core_dev_deps = []
# Core files with out-of-crate paths that cannot resolve in Neutron's layout, with the reason.
allow_core_path_escapes = [
    # A test of `fs_embed!` in dev mode reads `crates/util/src`; run util's tests with
    # `--features debug-embed`, which upstream tests with a different path.
    "crates/util/src/util.rs",
]

# Literals the path fixer cannot find by itself: paths resolved against the current directory,
# or targets that are not tracked upstream.
[[rewrite.literals]]
file = "crates/zed/src/main.rs"
literal = "crates/grammars/src"
base = "root"

[[rewrite.literals]]
file = "crates/zed/build.rs"
literal = "../../.git/logs/HEAD"
base = "crate"

[agents]
sections = ["Rust coding guidelines", "Timers in tests", "GPUI", "Rules Hygiene"]
# Zed's PR review workflow asks agents to edit README.md on every change; it does not apply here.
drop_lines_containing = ["Remove this line to confirm you've reviewed this PR"]
skills = ["gpui-test", "gpui-bench", "lint-creator"]

[doctor]
# `clock`'s tests only build with this feature (docs/known-issues.md).
check_features = ["clock/test-support"]
